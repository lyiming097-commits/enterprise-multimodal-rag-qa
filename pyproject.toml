[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-multimodal-rag"
version = "0.2.0"
description = "面向个人知识库的多模态 RAG 问答系统"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "pymupdf>=1.24,<2",
  "sentence-transformers>=3,<6",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.39,<2",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ocr = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "rapidocr-onnxruntime>=1.2,<2",
]
ocr-paddle = [
  "numpy>=1.26,<3",
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4",
  "pillow>=10,<13",
]
eval = ["ragas>=0.2.15,<0.3", "datasets>=3,<4"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
